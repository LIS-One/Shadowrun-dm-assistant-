spring:
  application:
    name: dm-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dm_assistant}
    username: ${DB_USERNAME:dm_assistant}
    password: ${DB_PASSWORD:dm_assistant}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_MAP_SIZE:50MB}
      max-request-size: ${MAX_MAP_SIZE:50MB}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth0:
    # Tenant URL with trailing slash, e.g. https://my-tenant.eu.auth0.com/
    issuer: ${AUTH0_ISSUER:}
    # API identifier configured in Auth0 → Applications → APIs
    audience: ${AUTH0_AUDIENCE:}
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:false}
    secret: ${DEV_AUTH_SECRET:}
  storage:
    maps-dir: ${MAPS_DIR:./data/maps}
  cors:
    # Only needed if the browser calls the API directly; the Next.js app proxies requests server-side.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
