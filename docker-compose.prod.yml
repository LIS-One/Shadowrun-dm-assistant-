# Production stack for a single server: PostgreSQL + Spring Boot API + Next.js + Caddy (automatic HTTPS).
#
#   cp .env.production.example .env   # fill in DOMAIN, DB_PASSWORD and the Auth0 values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). The API and the database stay on the
# internal Docker network: ports published by Docker bypass ufw, so nothing else is published.
# The dev login is always off here.

# Every service restarts after crashes/reboots and keeps at most ~30 MB of logs.
x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dm_assistant
      POSTGRES_USER: dm_assistant
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm_assistant"]
      interval: 5s
      retries: 20

  backend:
    <<: *restart
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dm_assistant
      DB_USERNAME: dm_assistant
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH0_ISSUER: https://${AUTH0_DOMAIN:?Set AUTH0_DOMAIN in .env}/
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in .env}
      DEV_AUTH_ENABLED: "false"
      # Keeps the JVM modest on small servers.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=40
    volumes:
      - map-images:/data/maps

  frontend:
    <<: *restart
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      AUTH_MODE: auth0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Set AUTH0_CLIENT_ID in .env}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?Set AUTH0_CLIENT_SECRET in .env}
      AUTH0_SECRET: ${AUTH0_SECRET:?Set AUTH0_SECRET in .env (openssl rand -hex 32)}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}

  caddy:
    <<: *restart
    image: caddy:2-alpine
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The whole folder is mounted (Caddy's advice) so edits to caddy/Caddyfile are always picked up.
      - ./caddy:/etc/caddy:ro
      # Certificates live here; losing this volume means re-issuing them.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  map-images:
  caddy-data:
  caddy-config:
